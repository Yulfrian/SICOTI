name: Configurar proyecto SICOTI

on:
  workflow_dispatch:

jobs:
  setup-project:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      repository-projects: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Dar permisos al script
        run: chmod +x sicoti-project-setup.sh

      - name: Crear etiqueta SICOTI si no existe
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: gh label create SICOTI --force || true

      - name: Ejecutar configuración del proyecto
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: ./sicoti-project-setup.sh
